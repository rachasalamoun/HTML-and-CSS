<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My One‑Page Website</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        nav { background: #333; padding: 10px; position: sticky; top: 0; }
        nav a { color: white; margin: 0 15px; text-decoration: none; }
        section { padding: 40px; }
        footer { background: #222; color: white; text-align: center; padding: 20px; }
        img { width: 250px; margin: 10px; border-radius: 8px; }
        form input, form textarea { display: block; margin: 10px 0; width: 300px; padding: 8px; }
    </style>
</head>

<body>

    <!-- Navigation with bookmarks -->
    <nav>
        <a href="#home">Home</a>
        <a href="#gallery">Pictures</a>
        <a href="#videos">Videos</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Home Section -->
    <section id="home">
        <h1>Welcome to My One‑Page Website</h1>
        <p>This is a simple but unique HTML project showcasing navigation, images, videos, and a contact form — all on one page.</p>
    </section>

    <!-- Pictures Section -->
    <section id="gallery">
        <h2>Picture Gallery</h2>
        <img src="https://cdn.pixabay.com/photo/2025/12/17/14/00/fishing-10020362_1280.jpg" alt="Sample Image 1">
        <img src="https://cdn.pixabay.com/photo/2025/12/17/14/00/fishing-10020362_1280.jpg" alt="Sample Image 1">
        <img src="https://cdn.pixabay.com/photo/2025/12/17/14/00/fishing-10020362_1280.jpg" alt="Sample Image 1">
    </section>

    <!-- Video Section -->
    <section id="videos">
        <h2>Featured Video</h2>
<iframe width="560" height="315" src="https://www.youtube.com/embed/ehcVomMexkY?si=hCpRqunTdoNrHZ3Z" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>    </section>

    <!-- Contact Form -->
    <section id="contact">
        <h2>Contact Me</h2>
        <form>
            <label>Name:</label>
            <input type="text" placeholder="Your name">

            <label>Email:</label>
            <input type="email" placeholder="Your email">

            <label>Message:</label>
            <textarea rows="5" placeholder="Your message"></textarea>

            <input type="submit" value="Send">
        </form>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 My One‑Page Website — All Rights Reserved</p>
    </footer>

</body>
</html>
